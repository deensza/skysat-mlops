# The stack on the always-on server (docs/server.md). Used on top of docker-compose.yml:
#   COMPOSE_FILE=docker-compose.yml:docker-compose.server.yml (set in the server's .env)
# The only way in from the internet: Caddy (HTTPS) -> Nginx (rate limit, login) -> API or Grafana.
# Secrets stay on the server: /opt/skysat/.env and /opt/skysat/gateway-users, never in git.
x-small-logs: &small-logs  # so logs (health checks, scanners) cannot fill the disk
  driver: json-file
  options:
    max-size: 10m
    max-file: "2"

services:
  hello:
    profiles: ["off"]

  mlflow:
    profiles: ["off"]

  api:
    logging: *small-logs
    restart: unless-stopped
    environment:
      MODEL_RELOAD_SECONDS: 60  # a promotion (make llm-promote) reaches the server within a minute, e.g. live in the demo
    depends_on: !override
      postgres:
        condition: service_healthy

  # HTTPS with a free certificate that Caddy gets and renews by itself. Port 80 only redirects to 443.
  caddy:
    logging: *small-logs
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in the server .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - nginx

  # The gateway (nginx/nginx.server.conf). Published on the server itself only: 8080 is for the smoke test.
  nginx:
    logging: *small-logs
    restart: unless-stopped
    ports: !override
      - "127.0.0.1:8080:8081"
    volumes: !override
      - ./nginx/nginx.server.conf:/etc/nginx/nginx.conf:ro
      - /opt/skysat/gateway-users:/etc/nginx/users:ro

  postgres:
    logging: *small-logs
    restart: unless-stopped
    ports: !override
      - "127.0.0.1:5432:5432"  # reachable only on the server itself

  # Behind the gateway's login, so viewers need no second login. They can send their own SQL to the data
  # source, so it connects as a read-only database user (nothing they send can change or delete the log).
  grafana:
    logging: *small-logs
    restart: unless-stopped
    ports: !reset []
    environment:
      GF_SERVER_ROOT_URL: https://${SITE_ADDRESS:?set SITE_ADDRESS in the server .env}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_AUTH_BASIC_ENABLED: "false"
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in the server .env}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:?set GRAFANA_DB_PASSWORD in the server .env}
    volumes: !override
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./monitoring/grafana/datasource.server.yml:/etc/grafana/provisioning/datasources/postgres.yml:ro

volumes:
  caddy-data:
