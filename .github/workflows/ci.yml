# CI/CD. Pipeline: test -> image -> deploy.
#   test    pushes and pull requests to main (and by hand), on GitHub's servers: pytest (no torch, no model, no dataset), including the
#           pipeline test tests/test_pipeline.py (intake -> queue -> trainer, training stubbed) when CI's PostgreSQL
#           is there; the Docker Compose files (local and server) must be valid; and both Nginx gateway configs
#           must pass `nginx -t`.
#   image   builds the complaint-box API image (llm/Dockerfile; no model inside: the 3 GB base model is downloaded at
#           the first start); on main it is pushed to ghcr.io (code only, no data, no model).
#   deploy  only on main, and only once the team's server has a self-hosted runner (label `skysat`) and the
#           repository variable DEPLOY_TO_RUNNER=true is set: pulls the new image on the server, restarts the
#           stack and smoke-tests it. If the smoke test fails, it rolls back to the previous image.
#           Never runs for pull requests (see docs/server.md). It ran once, on 13 Nov 2026 (run 43416289152), and
#           succeeded. Since then neither the runner nor the variable exists and the job is skipped; the version with
#           the rollback has never run. The server is updated by hand (docs/server.md).
# The adapter is not part of the image: the API serves whatever MLflow's `skysat-reviews@champion` points to.
# Training is not in this workflow (no GPU on GitHub): it is .github/workflows/train.yml, started by the drift check
# or by hand; the trainer runs on a RunPod GPU (llm/runpod_pod.py).
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:  # the review queue's SQL is tested against a real one (tests/test_queue.py)
        image: postgres:17.11-alpine
        env:
          POSTGRES_USER: skysat
          POSTGRES_PASSWORD: skysat
          POSTGRES_DB: skysat_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U skysat" --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://skysat:skysat@localhost:5432/skysat_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pytest==8.3.3

      - name: Run tests
        run: python -m pytest -v

      - name: Check docker-compose.yml
        run: docker compose --profile loadtest config --quiet

      - name: Check the server's compose files
        run: SITE_ADDRESS=x GRAFANA_ADMIN_PASSWORD=x GRAFANA_DB_PASSWORD=x docker compose -f docker-compose.yml -f docker-compose.server.yml config --quiet

      # A broken gateway config would otherwise only be found on the server.
      - name: Check the gateway configs
        run: |
          for f in nginx.conf nginx.server.conf; do
            docker run --rm --add-host api:127.0.0.1 --add-host intake:127.0.0.1 --add-host grafana:127.0.0.1 \
              -v "$PWD/nginx/$f:/etc/nginx/nginx.conf:ro" nginx:1.30.6-alpine nginx -t
          done

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Build the API image (the complaint box, no model download)
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}-api"
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          docker build -f llm/Dockerfile -t "$image:$GITHUB_SHA" -t "$image:latest" .

      - name: Push to ghcr.io (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:latest"

  deploy:
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_TO_RUNNER == 'true'
    runs-on: [self-hosted, skysat]
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    concurrency: server
    env:
      COMPOSE_PROJECT_NAME: skysat-mlops  # the stack already running on the server, so its data is kept
      COMPOSE_FILE: docker-compose.yml:docker-compose.server.yml
      COMPOSE_ENV_FILES: /opt/skysat/.env  # the server's own passwords (docs/server.md); never in git
      # The MLflow settings (MLFLOW_TRACKING_URI, _USERNAME, _PASSWORD) are not set here: Compose prefers the shell over
      # the env file, and an unset repository variable is an empty string that would replace the server's own value.
    steps:
      - uses: actions/checkout@v4

      - name: Remember what is running
        run: |
          id=$(docker compose ps -q api 2>/dev/null | head -n 1 || true)
          previous=""
          if [ -n "$id" ]; then previous=$(docker inspect --format '{{.Config.Image}}' "$id" 2>/dev/null || true); fi
          echo "Running now: ${previous:-nothing (first deploy)}"
          echo "PREVIOUS_IMAGE=$previous" >> "$GITHUB_ENV"

      - name: Pull the new API image
        run: |
          export API_IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}-api:$GITHUB_SHA"
          echo "API_IMAGE=$API_IMAGE" >> "$GITHUB_ENV"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker compose pull api

      - name: Restart the stack with it
        run: docker compose up -d --no-build

      - name: Smoke test through Nginx  # up to 6 min: the API loads a 3 GB base model at start
        run: bash .github/scripts/smoke-test.sh http://localhost:8080 120  # the gateway's port for the server itself

      # Only the image is rolled back: the compose and gateway files are the new commit's. The gateway check in the
      # test job is what catches a broken gateway file before it gets here.
      # The job still ends failed after a rollback: the deploy did fail, and that is intended.
      - name: Roll back to the previous image
        if: failure() && env.PREVIOUS_IMAGE != ''
        run: |
          API_IMAGE="$PREVIOUS_IMAGE" docker compose up -d --no-build
          if bash .github/scripts/smoke-test.sh http://localhost:8080 120; then
            echo "Rolled back to $PREVIOUS_IMAGE: the server is serving again"
          else
            echo "ROLLBACK FAILED: the server needs a person"
          fi
