# CI/CD (step 8). Pipeline: test -> image -> deploy.
#   test    every push and pull request, on GitHub's servers, on a small fake dataset (no Kaggle files);
#           the tests also train all 5 CT model types on it.
#   image   builds the API Docker image; on main it is pushed to ghcr.io (code only, no data, no model).
#   deploy  only on main, and only once the team's server has a self-hosted runner (label `skysat`) and the
#           repository variable DEPLOY_TO_RUNNER=true is set: pulls the new image on the server, restarts the
#           stack and smoke-tests it. Never runs for pull requests (see docs/server.md).
# The model itself is not part of the image: the API serves whatever MLflow's `champion` alias points
# to, and continuous training (.github/workflows/ct.yml) moves that alias.
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies (CPU-only PyTorch)
        run: |
          pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt -r api/requirements.txt pytest==8.3.3

      - name: Run tests
        run: python -m pytest -v

      - name: Check docker-compose.yml
        run: docker compose --profile loadtest config --quiet

      - name: Check the server's compose files
        run: SITE_ADDRESS=x GRAFANA_ADMIN_PASSWORD=x GRAFANA_DB_PASSWORD=x docker compose -f docker-compose.yml -f docker-compose.server.yml config --quiet

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Build the API image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}-api"
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          docker build -f api/Dockerfile -t "$image:$GITHUB_SHA" -t "$image:latest" .

      - name: Push to ghcr.io (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:latest"

  deploy:
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_TO_RUNNER == 'true'
    runs-on: [self-hosted, skysat]
    permissions:
      contents: read
      packages: read
    concurrency: server
    env:
      COMPOSE_PROJECT_NAME: skysat-mlops  # the stack already running on the server, so its data is kept
      COMPOSE_FILE: docker-compose.yml:docker-compose.server.yml
      COMPOSE_ENV_FILES: /opt/skysat/.env  # the server's own passwords (docs/server.md); never in git
      MLFLOW_TRACKING_URI: ${{ vars.MLFLOW_TRACKING_URI }}  # the APIs load the champion from the shared MLflow
      MLFLOW_TRACKING_USERNAME: ${{ vars.MLFLOW_TRACKING_USERNAME }}
      MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Pull the new API image
        run: |
          export API_IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}-api:$GITHUB_SHA"
          echo "API_IMAGE=$API_IMAGE" >> "$GITHUB_ENV"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker compose pull api

      - name: Restart the stack with it
        run: docker compose up -d --no-build

      - name: Smoke test through Nginx  # up to 6 min: a restart is slow on the server's 1 GB of RAM
        run: bash .github/scripts/smoke-test.sh http://localhost:8080 120  # the gateway's port for the server itself
