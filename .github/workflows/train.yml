# Train: rents a RunPod GPU, trains the LoRA adapter on the newest reviews from the server's queue, and deletes the pod.
# `python3 -m llm.runpod_pod` does the work: the trainer takes a batch of pending reviews, trains, runs the gate,
# registers the model in MLflow and promotes it only if it beats the champion. The server then loads the new
# champion by itself within a minute. The run's summary page shows the queue and the serving version before and after.
# It never trains with fewer than 300 pending reviews that the model has already scored as live traffic (no pod is
# started; a review is traffic first and training data after), and a run started by the drift check
# (reason other than "by hand") waits for the cooldown (TRAIN_COOLDOWN_HOURS, default 6) after the last run that
# rented a GPU. A run that found no free GPU rented nothing and does not count.
# Never two runs at once. A last step deletes any trainer pod that is still there; if it finds one, the run fails.
# If the run promoted a new champion, it closes the open "Drift detected" issue (the drift check opened it): the
# alarm is answered by the run that fixed it. Any other outcome leaves the issue open.
# The run ends green only if a version was registered. RunPod answers 403 to this project's API key on the pod-log
# endpoint, so the launcher reads the outcome from the server (reviews marked trained, serving version); a failed
# gate, too few reviews and a crash then all end as a failed run. If no GPU type in the list is free, the run fails
# without renting anything.
# While it runs, each event is a comment on the one open issue "Training runs" (GPU rented, MLflow run started, pod
# gone, how the run ended), each with a link to this run. The comments are written by the launcher and by the last
# step, never by the pod: the GitHub token does not reach it. A comment that fails never fails or slows the run.
#
# By hand: Actions -> Train -> Run workflow (reason and trainer arguments are optional), or `gh workflow run train.yml`.
# Called by drift.yml when the repository variable AUTO_RETRAIN is `true`.
# Setup (repository owner, once; see docs/server.md):
#   secrets    RUNPOD_API_KEY (RUNPOD_API is read too), SKYSAT_SERVER (host name, no https://),
#              SKYSAT_TRAINER_PASSWORD (the gateway's `trainer` login), MLFLOW_TRACKING_PASSWORD
#   variables  MLFLOW_TRACKING_URI, MLFLOW_TRACKING_USERNAME; optional TRAIN_COOLDOWN_HOURS
name: Train

on:
  workflow_dispatch:
    inputs:
      reason:
        description: Why this run starts (shown on the summary page; "by hand" skips the cooldown)
        default: by hand
      trainer_args:
        description: Extra arguments for the trainer (optional; for example --max-train-seconds 60 to cut the training part short)
        default: ""
  workflow_call:
    inputs:
      reason:
        type: string
        default: drift
      trainer_args:
        type: string
        default: ""
    secrets:
      RUNPOD_API_KEY:
        required: false
      RUNPOD_API:
        required: false
      SKYSAT_SERVER:
        required: false
      SKYSAT_TRAINER_PASSWORD:
        required: false
      SKYSAT_LOGIN:
        required: false
      MLFLOW_TRACKING_PASSWORD:
        required: false

permissions:
  contents: read
  actions: read  # gh run list (the cooldown)
  issues: write  # to close the "Drift detected" issue after a promotion, and to comment on "Training runs"

concurrency:
  group: train
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    # also here: a workflow-level group may not hold when this file is called by the drift check, and the sweep of
    # one run must never delete the pod of another
    concurrency:
      group: train-gpu
      cancel-in-progress: false
    outputs:
      started: ${{ steps.train.conclusion != 'skipped' }}
      registered: ${{ steps.train.outputs.registered }}
      version: ${{ steps.train.outputs.version }}
      promoted: ${{ steps.train.outputs.promoted }}
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY || secrets.RUNPOD_API }}
      SKYSAT_SERVER: ${{ secrets.SKYSAT_SERVER }}
      QUEUE_URL: ${{ secrets.SKYSAT_SERVER && format('https://{0}', secrets.SKYSAT_SERVER) || '' }}
      QUEUE_USER: trainer
      QUEUE_PASSWORD: ${{ secrets.SKYSAT_TRAINER_PASSWORD }}
      MLFLOW_TRACKING_URI: ${{ vars.MLFLOW_TRACKING_URI }}
      MLFLOW_TRACKING_USERNAME: ${{ vars.MLFLOW_TRACKING_USERNAME }}
      MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      COMMENT_SCRIPT: .github/scripts/train-comment.sh  # make train-remote leaves it unset and comments nothing
      COOLDOWN_HOURS: ${{ vars.TRAIN_COOLDOWN_HOURS || '6' }}
      REASON: ${{ inputs.reason }}
      TRAINER_ARGS: ${{ inputs.trainer_args }}
    steps:
      - name: Check the settings exist
        id: settings
        run: |
          missing=0
          for name in RUNPOD_API_KEY SKYSAT_SERVER QUEUE_PASSWORD MLFLOW_TRACKING_URI MLFLOW_TRACKING_USERNAME \
                      MLFLOW_TRACKING_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "Missing $name (secret or variable; QUEUE_PASSWORD is SKYSAT_TRAINER_PASSWORD, SKYSAT_SERVER is the server): see docs/server.md"
              missing=1
            fi
          done
          exit $missing

      - uses: actions/checkout@v4

      # A run counts if it rented a GPU (its "A GPU was rented" step ran), whether the training then worked or failed
      # and whether it was started here or as a job of the drift check. Runs that were skipped or found no free GPU
      # do not count, or the cooldown would never end.
      # If the history cannot be read, nothing is rented.
      # The list holds 200 runs because the drift check may soon be started every 10 minutes from the server
      # (monitoring/drift-trigger.sh): 60 runs would not reach back 6 hours, and a rental could fall off the list.
      - name: Cooldown
        id: cooldown
        if: env.REASON != 'by hand'
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          from datetime import datetime, timedelta, timezone

          def gh(*args):
              return json.loads(subprocess.run(["gh", *args], check=True, capture_output=True, text=True, timeout=60).stdout)

          def note(skip, text=""):
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write(f"skip={'true' if skip else 'false'}\n")
              if text:
                  with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
                      f.write(text + "\n")
              raise SystemExit(0)

          hours = float(os.environ["COOLDOWN_HOURS"])
          since = datetime.now(timezone.utc) - timedelta(hours=hours)
          try:
              runs = gh("run", "list", "--limit", "200", "--json", "databaseId,createdAt,workflowName")
              for run in runs:
                  created = datetime.fromisoformat(run["createdAt"].replace("Z", "+00:00"))
                  if (str(run["databaseId"]) == os.environ["GITHUB_RUN_ID"] or created < since
                          or run["workflowName"] not in ("Train", "Drift check")):
                      continue
                  for job in gh("run", "view", str(run["databaseId"]), "--json", "jobs")["jobs"]:
                      for step in job.get("steps", []):
                          if step["name"] == "A GPU was rented" and step.get("conclusion") != "skipped":
                              note(True, f"Training skipped by the cooldown: a GPU was rented at {created:%Y-%m-%d %H:%M} UTC "
                                         f"(run {run['databaseId']}), the cooldown is {hours:g} hours.")
          except SystemExit:
              raise
          except Exception as err:  # gh failed, or its answer changed shape
              note(True, f"Training skipped: could not read the run history ({type(err).__name__}).")
          note(False)
          PY

      - name: Queue before
        id: before
        if: steps.cooldown.outputs.skip != 'true'
        run: |
          stats="$(curl -sS --fail --max-time 30 -u "trainer:$QUEUE_PASSWORD" "$QUEUE_URL/queue/stats")"
          model="$(curl -sS --fail --max-time 30 -u "trainer:$QUEUE_PASSWORD" "$QUEUE_URL/model" || echo '{}')"  # no model yet
          STATS="$stats" MODEL="$model" python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          s = json.loads(os.environ["STATS"])
          ready = s.get("ready", s["pending"])  # pending reviews the model has already scored as live traffic
          print("pending=%d" % s["pending"])
          print("trained=%d" % s["trained"])
          print("model=%s" % json.loads(os.environ["MODEL"]).get("version"))
          if ready < 300:
              print("skip=true")
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
                  f.write("Too few new reviews to train (%d pending, %d of them already scored live, 300 needed): "
                          "no pod was started.\n" % (s["pending"], ready))
          PY

      # 45 minutes at the dearest GPU in the list (RTX 4090, $0.34/h, tried last) is at most about $0.26 per run;
      # a run on the usual RTX 3070 took about 5 minutes (about one cent).
      - name: Train on a rented GPU
        id: train
        if: steps.cooldown.outputs.skip != 'true' && steps.before.outputs.skip != 'true'
        run: python3 -u -m llm.runpod_pod --wait --branch "$GITHUB_REF_NAME" --max-minutes 45 --trainer-args="$TRAINER_ARGS"

      # The cooldown of later runs looks for this step: it runs only if a pod was really created.
      - name: A GPU was rented
        if: always() && steps.train.outputs.pod_id != ''
        env:
          POD_ID: ${{ steps.train.outputs.pod_id }}
        run: echo "Pod $POD_ID was rented for this run"

      - name: No pod may be left behind
        if: always() && steps.settings.outcome == 'success'
        run: python3 -m llm.runpod_pod --sweep

      # Only a promotion answers the alarm: the model that drifted no longer serves.
      - name: Close the drift issue
        if: steps.train.outputs.promoted == 'true'
        continue-on-error: true  # a failed `gh issue` must not turn a good training red
        env:
          VERSION: ${{ steps.train.outputs.version }}
        run: bash .github/scripts/close-drift-issue.sh "$VERSION" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Summary
        id: summary
        if: always()
        env:
          T_POD: ${{ steps.train.outputs.pod_id }}
          COOLDOWN_SKIP: ${{ steps.cooldown.outputs.skip }}
          BEFORE_SKIP: ${{ steps.before.outputs.skip }}
          BEFORE_PENDING: ${{ steps.before.outputs.pending }}
          BEFORE_TRAINED: ${{ steps.before.outputs.trained }}
          BEFORE_MODEL: ${{ steps.before.outputs.model }}
          T_REGISTERED: ${{ steps.train.outputs.registered }}
          T_VERSION: ${{ steps.train.outputs.version }}
          T_PROMOTED: ${{ steps.train.outputs.promoted }}
          T_STARTED: ${{ steps.train.conclusion != 'skipped' }}
        run: |
          stats="$(curl -sS --fail --max-time 30 -u "trainer:$QUEUE_PASSWORD" "$QUEUE_URL/queue/stats" 2>/dev/null || true)"
          model="$(curl -sS --fail --max-time 30 -u "trainer:$QUEUE_PASSWORD" "$QUEUE_URL/model" 2>/dev/null || true)"
          STATS="$stats" MODEL="$model" python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          e = lambda k: os.environ.get(k) or "-"
          try:
              s, m = json.loads(os.environ["STATS"]), json.loads(os.environ["MODEL"] or "{}")
              after = (int(s["pending"]), int(s["trained"]), str(m.get("version", "-"))[:20])
              note = ""
          except Exception:
              after, note = ("?", "?", "?"), "The queue could not be read after the run."
          print("### Train\n")
          print("| | before | after |\n|---|---|---|")
          print(f"| Reason | {e('REASON')} | |")
          print(f"| Pending reviews | {e('BEFORE_PENDING')} | {after[0]} |")
          print(f"| Trained reviews | {e('BEFORE_TRAINED')} | {after[1]} |")
          print(f"| Serving model version | {e('BEFORE_MODEL')} | {after[2]} |")
          print(f"| Registered | {e('T_REGISTERED')} | |\n| New version | {e('T_VERSION')} | |\n| Promoted | {e('T_PROMOTED')} | |\n")
          if note:
              print(note + "\n")
          if e("COOLDOWN_SKIP") == "true":
              ending = "Skipped by the cooldown (the reason is above): no pod was started."
          elif e("BEFORE_SKIP") == "true":
              ending = "Skipped because there are too few new reviews (300 are needed): no pod was started."
          elif e("T_REGISTERED") == "true" and e("T_PROMOTED") == "true":
              ending = "A new version was registered and promoted: the server loads it within a minute."
          elif e("T_REGISTERED") == "true":
              ending = "A new version was registered but the champion stays: it did not beat it on the same reviews."
          elif e("T_REGISTERED") == "false":
              ending = ("Nothing was registered: the gate failed, there were too few reviews, or the trainer crashed. "
                        "The batch went back to pending.")
          elif e("T_STARTED") == "true" and e("T_POD") == "-":  # the step ran and no pod was ever created
              ending = "No GPU type in the list was free: nothing was rented and nothing was trained."
          elif e("T_STARTED") == "true":
              ending = "The outcome is unknown: neither the pod's log nor the server could be read."
          else:
              ending = "No pod was started."
          print(ending)
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:  # for the comment on the "Training runs" issue
              f.write(f"ending={ending}\n")
          PY

      # The last event of the run on the "Training runs" issue; a comment that fails must not turn a run red or slow it.
      - name: Comment the ending
        if: always() && steps.settings.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 2
        env:
          ENDING: ${{ steps.summary.outputs.ending }}
        run: bash .github/scripts/train-comment.sh "${ENDING:-The run ended without a summary line.}"
