# Drift check on the server's traffic: reads GET /scores/recent (aggregates only: counts, MAE, accuracy, shares; never
# review text) through the gateway and compares the live MAE and recommended accuracy with the gate in llm/gate.py
# (MAE <= 1.0, recommended >= 0.90) over at least 100 labelled requests, and only when it misses by more than the
# sampling noise (llm/drift_check.py). The labelled requests are the intake's live traffic: each passenger review,
# sent to the model with its true labels.
# On drift it opens a GitHub issue. It does NOT retrain on GitHub (no GPU): the trainer runs on a RunPod GPU
# (`make train-remote`, or by itself when the server's intake has AUTO_TRAIN=1); the new adapter is promoted only
# if it beats the champion, and the server loads it by itself within minutes.
# The run's summary page shows the table (numbers, never rows).
#
# By hand: Actions -> Drift check -> Run workflow, or `gh workflow run drift.yml`.
# Setup (repository owner, once): secrets SKYSAT_SERVER and SKYSAT_LOGIN (the gateway login for GitHub, docs/server.md).
name: Drift check

on:
  # Enable for the final run: remove the `#` of the next two lines.
  # schedule:
  #   - cron: "35 * * * *"  # every hour at :35
  workflow_dispatch:

permissions:
  contents: read
  issues: write  # to open the "Drift detected" issue with GITHUB_TOKEN

concurrency:
  group: drift

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SKYSAT_SERVER: ${{ secrets.SKYSAT_SERVER }}
      SKYSAT_LOGIN: ${{ secrets.SKYSAT_LOGIN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check the settings exist
        run: |
          for name in SKYSAT_SERVER SKYSAT_LOGIN; do
            test -n "${!name}" || { echo "Missing secret $name: see docs/server.md (The automatic loop)"; exit 1; }
          done

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Drift check
        id: drift
        # Exit code 2 means the server could not be read: the job fails on purpose, an outage is not "no drift".
        run: |
          export API_USER="${SKYSAT_LOGIN%%:*}" API_PASSWORD="${SKYSAT_LOGIN#*:}"
          python -m llm.drift_check --url "https://$SKYSAT_SERVER" --hours 24

      - name: Open an issue on drift
        if: steps.drift.outputs.drift == 'true'
        run: |
          title="Drift detected: retrain the LoRA adapter (make train-remote)"
          if [ -n "$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[].number')" ]; then
            echo "An issue about this is already open"; exit 0
          fi
          cat > body.md <<EOF
          The live accuracy of the champion fell below the gate in llm/gate.py (MAE <= 1.0, recommended >= 0.90) over at least 100 labelled requests in the last 24 hours, and by more than the sampling noise. The table is on the summary page of [this run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID).

          Retraining needs a GPU, so it does not run on GitHub. Run \`make train-remote\` (a RunPod pod takes the newest reviews from the queue, trains, and deletes itself). A new adapter is promoted only if it beats the champion.
          EOF
          gh issue create --title "$title" --body-file body.md
