# Step 5 – Load balancer in front of the API copies.
# `docker compose up --scale api=N` starts N copies that all answer to the name "api".
# `resolve` makes Nginx ask Docker's DNS again every few seconds, so scaling up or down
# works without restarting Nginx. Requests are spread round-robin.
worker_processes auto;

events {
    worker_connections 4096;
}

http {
    resolver 127.0.0.11 valid=5s ipv6=off;  # Docker's internal DNS
    access_log off;

    upstream api {
        zone api 64k;
        server api:8000 resolve;
        keepalive 64;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_next_upstream error timeout;  # a copy that is down is skipped
            add_header X-Upstream $upstream_addr always;  # which copy answered
        }
    }
}
