# Gateway in front of the complaint-box API (llm/serve.py). One API container, one review at a time (a lock inside),
# so requests queue there: the read timeout is long because a CPU generation takes seconds.
# `resolve` makes Nginx ask Docker's DNS again every few seconds, so a restarted API is found without restarting Nginx.
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 valid=5s ipv6=off;  # Docker's internal DNS
    access_log off;

    upstream api {
        zone api 64k;
        server api:8000 resolve;
        keepalive 16;
    }

    server {
        listen 80;
        proxy_read_timeout 120s;

        # Only these paths go to the API; everything else is 404
        location ~ ^/(score|model|health|docs|openapi\.json|scores/recent)$ {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
        }
    }
}
