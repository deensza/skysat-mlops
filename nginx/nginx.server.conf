# The gateway on the server (docs/server.md): everything from the internet passes here, after Caddy's HTTPS.
# Order matters: the rate limit runs before the login, so guessing passwords is limited too.
worker_processes 1;

events {
    worker_connections 512;
}

http {
    resolver 127.0.0.11 valid=5s ipv6=off;  # Docker's internal DNS
    server_tokens off;
    client_max_body_size 16k;  # a passenger is about 1 kB
    log_format gateway '$remote_addr $remote_user "$request" $status';
    access_log /dev/stdout gateway;

    # The real client address, as Caddy reports it (what a client sends itself is ignored)
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Forwarded-For;

    limit_req_zone $binary_remote_addr zone=per_client:5m rate=20r/s;
    limit_conn_zone $binary_remote_addr zone=connections:5m;
    limit_req_status 429;
    limit_conn_status 429;

    upstream api {
        zone api 64k;
        server api:8000 resolve;
        keepalive 16;
    }

    # From the internet, through Caddy
    server {
        listen 80;
        limit_req zone=per_client burst=100 nodelay;  # burst: a Grafana page loads many files at once
        limit_conn connections 30;
        auth_basic "SkySat demo";
        auth_basic_user_file /etc/nginx/users;  # two accounts, the file exists only on the server

        location / {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header Authorization "";  # the login ends here
        }

        location /grafana/ {
            set $grafana http://grafana:3000;
            proxy_pass $grafana;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $http_connection;
            proxy_set_header Host $host;
            proxy_set_header Authorization "";
        }
    }

    # Only on the server itself (127.0.0.1:8080 in docker-compose.server.yml): smoke test and self-healing
    server {
        listen 8081;

        location / {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
        }
    }
}
