# Services are added step by step (step 3: MLflow; later: API, Nginx, PostgreSQL, Grafana).
services:
  hello:
    image: python:3.12-slim
    command: ["python", "-c", "print('SkySat: Docker ortami hazir')"]

  # Experiment tracking + model registry. UI: http://localhost:5050
  # (host port 5050 because macOS uses 5000 for AirPlay)
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.17.1
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
      --allowed-hosts mlflow:5000,localhost:*,127.0.0.1:*
    ports:
      - "5050:5000"
    volumes:
      - mlflow-data:/mlflow

  # The complaint-box API (llm/serve.py, docs/llm.md): the only model. Not published directly: use
  # http://localhost:8080 (POST /score, Swagger: /docs). CPU only: a review takes seconds, one at a time.
  # The base model (~3 GB) is downloaded at the first start into the llm-models volume; the adapter
  # (skysat-reviews@champion) comes from MLflow. Until a champion exists (make llm-train) /health answers 503.
  api:
    # CD sets API_IMAGE to the image CI pushed to ghcr.io; locally the image is built from source
    image: ${API_IMAGE:-skysat-api:local}
    build:
      context: .
      dockerfile: llm/Dockerfile
    environment:
      # The team's shared MLflow (DagsHub) when it is set in .env, else the local one below
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-http://mlflow:5000}
      MLFLOW_TRACKING_USERNAME: ${MLFLOW_TRACKING_USERNAME:-}
      MLFLOW_TRACKING_PASSWORD: ${MLFLOW_TRACKING_PASSWORD:-}
      MODEL_RELOAD_SECONDS: ${MODEL_RELOAD_SECONDS:-300}
      LLM_DTYPE: ${LLM_DTYPE:-bfloat16}
      DATABASE_URL: postgresql://skysat:${POSTGRES_PASSWORD:-skysat}@postgres:5432/skysat
    volumes:
      - llm-models:/models
    mem_limit: 8g
    depends_on:
      mlflow:
        condition: service_started
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 600s  # the first start downloads the 3 GB base model

  # Gateway: http://localhost:8080
  nginx:
    image: nginx:1.30.6-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_started  # not healthy: the first start downloads the base model, and there may be no champion yet

  # Load test, only on demand (a few reviews a minute: the model is slow on CPU): docker compose --profile loadtest run --rm --no-deps k6
  k6:
    image: grafana/k6:1.8.1
    profiles: ["loadtest"]
    volumes:
      - ./loadtest:/scripts:ro
    command: ["run", "/scripts/score.js"]
    depends_on:
      - nginx

  # Prediction log (table llm_scores, monitoring/init.sql). Port 5432 is published for debugging on the host.
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_USER: skysat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-skysat}
      POSTGRES_DB: skysat
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./monitoring/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skysat -d skysat"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Dashboards: http://localhost:3000 (opens without login, read-only; admin / admin to edit)
  grafana:
    image: grafana/grafana:12.4.13
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-skysat}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/skysat.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports:
      - "3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  mlflow-data:
  postgres-data:
  llm-models:
