# Services are added step by step (step 3: MLflow; later: API, Nginx, PostgreSQL, Grafana).
services:
  hello:
    image: python:3.12-slim
    command: ["python", "-c", "print('SkySat: Docker ortami hazir')"]

  # Experiment tracking + model registry. UI: http://localhost:5050
  # (host port 5050 because macOS uses 5000 for AirPlay)
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.17.1
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
      --allowed-hosts mlflow:5000,localhost:*,127.0.0.1:*
    ports:
      - "5050:5000"
    volumes:
      - mlflow-data:/mlflow

  # Prediction API (step 4), 3 copies behind Nginx (step 5). Not published directly:
  # use http://localhost:8080 (Swagger: /docs). Change the number: docker compose up -d --scale api=1
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    deploy:
      replicas: 3
    depends_on:
      - mlflow
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 30

  # Load balancer (step 5): http://localhost:8080
  nginx:
    image: nginx:1.30.6-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

  # Load test (step 5), only on demand: docker compose --profile loadtest run --rm --no-deps k6
  k6:
    image: grafana/k6:1.8.1
    profiles: ["loadtest"]
    volumes:
      - ./loadtest:/scripts:ro
    command: ["run", "/scripts/predict.js"]
    depends_on:
      - nginx

volumes:
  mlflow-data:
