# Services are added step by step (step 3: MLflow; later: API, Nginx, PostgreSQL, Grafana).
services:
  hello:
    image: python:3.12-slim
    command: ["python", "-c", "print('SkySat: Docker ortami hazir')"]

  # Experiment tracking + model registry. UI: http://localhost:5050
  # (host port 5050 because macOS uses 5000 for AirPlay)
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.17.1
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
      --allowed-hosts mlflow:5000,localhost:*,127.0.0.1:*
    ports:
      - "5050:5000"
    volumes:
      - mlflow-data:/mlflow

  # Prediction API (step 4). Swagger: http://localhost:8000/docs
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    ports:
      - "8000:8000"
    depends_on:
      - mlflow
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  mlflow-data:
