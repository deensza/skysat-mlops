# Services are added step by step (step 3: MLflow; later: API, Nginx, PostgreSQL, Grafana).
services:
  hello:
    image: python:3.12-slim
    command: ["python", "-c", "print('SkySat: Docker ortami hazir')"]

  # Experiment tracking + model registry. UI: http://localhost:5050
  # (host port 5050 because macOS uses 5000 for AirPlay)
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.17.1
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
      --allowed-hosts mlflow:5000,localhost:*,127.0.0.1:*
    ports:
      - "5050:5000"
    volumes:
      - mlflow-data:/mlflow

  # Prediction API (step 4), 3 copies behind Nginx (step 5). Not published directly:
  # use http://localhost:8080 (Swagger: /docs). Change the number: docker compose up -d --scale api=1
  api:
    # CD (step 8) sets API_IMAGE to the image CI pushed to ghcr.io; locally the image is built from source
    image: ${API_IMAGE:-skysat-api:local}
    build:
      context: .
      dockerfile: api/Dockerfile
      args:
        TORCH_INDEX: ${TORCH_INDEX:-https://download.pytorch.org/whl/cpu}
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      DATABASE_URL: postgresql://skysat:${POSTGRES_PASSWORD:-skysat}@postgres:5432/skysat
    deploy:
      replicas: 3
    depends_on:
      mlflow:
        condition: service_started
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 30

  # Load balancer (step 5): http://localhost:8080
  nginx:
    image: nginx:1.30.6-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_started  # not healthy: on a fresh start there is no champion yet (API answers 503)

  # Load test (step 5), only on demand: docker compose --profile loadtest run --rm --no-deps k6
  k6:
    image: grafana/k6:1.8.1
    profiles: ["loadtest"]
    volumes:
      - ./loadtest:/scripts:ro
    command: ["run", "/scripts/predict.js"]
    depends_on:
      - nginx

  # Prediction log (step 6). Port 5432 is published for training/retrain.py on the host.
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_USER: skysat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-skysat}
      POSTGRES_DB: skysat
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./monitoring/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skysat -d skysat"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Dashboards (step 6): http://localhost:3000 (opens without login, read-only; admin / admin to edit)
  grafana:
    image: grafana/grafana:12.4.13
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-skysat}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/skysat.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports:
      - "3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      postgres:
        condition: service_healthy

  # Continuous training worker (step 8): make start-ct / make stop-ct; queue models with make add-ct.
  # Trains every job in the CT queue (table ct_jobs in PostgreSQL) and promotes the best (training/ct_worker.py).
  # The Kaggle files are mounted, never copied into the image; SKYSAT_DATA_DIR points at them when the repo
  # checkout has no data/ (self-hosted runner). Runs as your user so files written into data/ stay yours.
  ct-worker:
    build:
      context: .
      dockerfile: training/Dockerfile
      args:
        TORCH_INDEX: ${TORCH_INDEX:-https://download.pytorch.org/whl/cpu}
    profiles: ["ct"]
    restart: unless-stopped
    stop_grace_period: 30s  # time to put a running job back in the queue
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      DATABASE_URL: postgresql://skysat:${POSTGRES_PASSWORD:-skysat}@postgres:5432/skysat
      GIT_COMMIT: ${GIT_COMMIT:-}
      GIT_PYTHON_REFRESH: quiet  # no git in the image: silence MLflow's "Failed to import Git" warnings
    volumes:
      - ${SKYSAT_DATA_DIR:-./data}:/app/data
    depends_on:
      mlflow:
        condition: service_started
      postgres:
        condition: service_healthy

volumes:
  mlflow-data:
  postgres-data:
